spring:
  datasource:
    url: jdbc:h2:mem:taller_zapata_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    # H2 en modo MySQL. Las variantes compatibles con H2 de V85/V87 viven en db/migration-h2.
    locations: classpath:db/migration,classpath:db/migration-h2

app:
  storage:
    mode: local
    local-path: ./target/test-storage

logging:
  level:
    root: WARN
