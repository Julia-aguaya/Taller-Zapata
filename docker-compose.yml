services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taller_zapata
      MYSQL_USER: taller
      MYSQL_PASSWORD: taller
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run -Dspring-boot.run.profiles=local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/taller_zapata?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
      SPRING_DATASOURCE_USERNAME: taller
      SPRING_DATASOURCE_PASSWORD: taller
      APP_SECURITY_JWT_SECRET: change-this-secret-in-real-environments-change-this-secret-in-real-environments
      APP_STORAGE_LOCAL_PATH: /app/var/storage
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
      - backend_storage:/app/var/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  maven_cache:
  frontend_node_modules:
  backend_storage:
